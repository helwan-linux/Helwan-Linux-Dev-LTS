name: Build Arch ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Maximize Build Space
        run: |
          # مسح الملفات الضخمة لتوفير مساحة إضافية
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/jvm /usr/local/share/boost /usr/share/java /usr/share/perl /usr/share/php
          sudo apt-get clean
          docker system prune -a -f
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          mkdir -p out work
          chmod 777 out work

          docker run --rm --privileged \
            -v ${{ github.workspace }}:/repo \
            archlinux:latest \
            /bin/bash -c "
              # 1. تحديث النظام
              pacman -Syu --noconfirm && \
              # 2. تحديث المفاتيح
              pacman -Sy --noconfirm archlinux-keyring && \
              # 3. تثبيت الأدوات
              pacman -S --noconfirm archiso git reflector && \
              # 4. تحديث mirrors
              reflector --latest 10 --sort rate --save /etc/pacman.d/mirrorlist && \
              # 5. مسح الكاش
              pacman -Scc --noconfirm && \
              # 6. تعديل pacman.conf
              sed -i 's/SigLevel    = Required DatabaseOptional/SigLevel = Optional TrustAll/g' /repo/pacman.conf && \
              # 7. حذف الحزم غير الموجودة
              sed -i '/^cheese$/d' /repo/packages.x86_64 && \
              # 8. تشغيل البناء باستخدام مجلد العمل داخل /repo
              mkarchiso -v -w /repo/work -o /repo/out /repo
            "

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arch-iso
          path: out/*.iso
