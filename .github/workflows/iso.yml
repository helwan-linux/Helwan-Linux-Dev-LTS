name: Build Arch ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Maximize Build Space
        run: |
          # تنظيف شامل للمساحة قبل البدء
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/jvm /usr/local/share/boost /usr/share/java /usr/share/perl /usr/share/php
          sudo apt-get clean
          docker system prune -a -f
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          mkdir -p out work
          chmod 777 out work

          docker run --rm --privileged \
            -v ${{ github.workspace }}:/repo \
            archlinux:latest \
            /bin/bash -c "
              # تحديث النظام وتثبيت أدوات البناء
              pacman -Sy --noconfirm archlinux-keyring && \
              pacman -Syu --noconfirm archiso git reflector && \
              
              # ضبط المرايا الأسرع
              reflector --latest 5 --protocol https --sort rate --save /etc/pacman.d/mirrorlist && \
              
              # إعداد ملف التكوين
              cp /repo/pacman.conf /etc/pacman.conf && \
              sed -i 's/SigLevel    = Required DatabaseOptional/SigLevel = Optional TrustAll/g' /etc/pacman.conf && \
              
              # البناء داخل مجلد work المرتبط بـ github.workspace
              mkarchiso -v -w /repo/work -o /repo/out /repo
            "

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arch-iso
          path: out/*.iso
