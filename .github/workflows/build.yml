name: Build Arch ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/jvm /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          mkdir -p out
          chmod 777 out

          docker run --rm --privileged \
            -v ${{ github.workspace }}:/repo \
            archlinux:latest \
            /bin/bash -c "
              # 1. تحديث مفاتيح النظام أولاً لتفادي أخطاء التوقيع
              pacman -Sy --noconfirm archlinux-keyring && \

              # 2. تحديث النظام وتثبيت أدوات البناء
              pacman -Syu --noconfirm archiso git reflector && \

              # 3. تحديث قائمة الـ mirrors
              reflector --latest 10 --sort rate --save /etc/pacman.d/mirrorlist && \

              # 4. تنظيف الكاش
              pacman -Scc --noconfirm && \

              # 5. تشغيل البناء مباشرة (تأكد أن مسار المستودع هو مسار الـ archiso profile الأساسي)
              mkarchiso -v -w /tmp/archiso-work -o /repo/out /repo
            "

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arch-iso
          path: out/*.iso
