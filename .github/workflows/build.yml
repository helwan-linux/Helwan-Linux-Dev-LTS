name: Build Arch ISO

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # سيتم تشغيل الرفع تلقائياً عند عمل Tag يبدأ بحرف v (مثل v1.0.0)
  workflow_dispatch:

permissions:
  contents: write # مطلوب للسماح للـ Workflow بإنشاء الـ Release ورفع الملفات إليه

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/jvm /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build ISO
        run: |
          mkdir -p out
          chmod 777 out

          docker run --rm --privileged \
            -v ${{ github.workspace }}:/repo \
            archlinux:latest \
            /bin/bash -c "
              # 1. تحديث مفاتيح النظام أولاً لتفادي أخطاء التوقيع
              pacman -Sy --noconfirm archlinux-keyring && \

              # 2. تحديث النظام وتثبيت أدوات البناء
              pacman -Syu --noconfirm archiso git reflector && \

              # 3. تحديث قائمة الـ mirrors
              reflector --latest 10 --sort rate --save /etc/pacman.d/mirrorlist && \

              # 4. تنظيف الكاش
              pacman -Scc --noconfirm && \

              # 5. تشغيل البناء مباشرة
              mkarchiso -v -w /tmp/archiso-work -o /repo/out /repo
            "

      - name: Upload ISO to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
