name: Clear Old Artifacts

on:
  workflow_dispatch:

jobs:
  delete_artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all repository artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching artifacts list..."
          ARTIFACTS=$(gh api repos/$REPO/actions/artifacts --jq '.artifacts[].id')
          
          if [ -z "$ARTIFACTS" ]; then
            echo "No artifacts found to delete."
            exit 0
          fi

          for id in $ARTIFACTS; do
            echo "Deleting artifact ID: $id"
            gh api -X DELETE repos/$REPO/actions/artifacts/$id || echo "Failed to delete $id"
          done
          
          echo "All old artifacts have been successfully cleaned up!"
